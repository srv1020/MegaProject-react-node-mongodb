services:

  mongo:
    image: mongo:7

    container_name: mongo

    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secure123

    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend

    container_name: backend

    restart: always

    ports:
      - "5001:5001"

    environment:
      PORT: 5001

      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB_NAME: userdb
      MONGO_AUTH_SOURCE: admin

      MONGO_USER: admin
      MONGO_PASSWORD: secure123

      JWT_SECRET: this-is-a-long-random-secret

      CORS_ORIGIN: http://localhost:3000

    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5001

    container_name: frontend

    restart: always

    ports:
      - "3000:3000"

    environment:
      REACT_APP_API_URL: http://localhost:5001

    depends_on:
      - backend

volumes:
  mongo-data: