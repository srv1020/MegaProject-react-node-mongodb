name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docker-compose.yaml"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ======================
      # Frontend
      # ======================

      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=http://backend:5001 \
            -t ${{ secrets.DOCKER_USERNAME }}/frontend:${IMAGE_TAG} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:${IMAGE_TAG}

      # ======================
      # Backend
      # ======================

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG} \
            ./backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG}

      # ======================
      # Update Backend Tag
      # ======================

      - name: Update backend image tag
        run: |
          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG}|g" docker-compose.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docker-compose.yaml

          git commit -m "Update backend image tag to ${IMAGE_TAG}" || echo "No changes"

          git push

      # ======================
      # Print Tags
      # ======================

      - name: Show Image Tags
        run: |
          echo "Frontend: ${{ secrets.DOCKER_USERNAME }}/frontend:${IMAGE_TAG}"
          echo "Backend: ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG}"
