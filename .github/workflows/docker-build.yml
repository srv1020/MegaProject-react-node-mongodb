name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docker-compose.yaml"
      - "helm/mega-app/values.yaml"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ======================
      # Frontend
      # ======================

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/frontend:${IMAGE_TAG} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:${IMAGE_TAG}

      # ======================
      # Backend
      # ======================

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG} \
            ./backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG}

      # ======================
      # Update docker-compose.yaml
      # ======================

      - name: Update docker-compose backend tag
        run: |
          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG}|g" docker-compose.yaml

      # ======================
      # Update Helm values.yaml
      # ======================

      - name: Update Helm image tags
        run: |
          sed -i "/frontend:/,/imagePullPolicy:/ s|tag: .*|tag: ${IMAGE_TAG}|" helm/mega-app/values.yaml

          sed -i "/backend:/,/imagePullPolicy:/ s|tag: .*|tag: ${IMAGE_TAG}|" helm/mega-app/values.yaml

      # ======================
      # Commit Updated Files
      # ======================

      - name: Commit updated tags
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docker-compose.yaml
          git add helm/mega-app/values.yaml

          git commit -m "Update image tags to ${IMAGE_TAG}" || echo "No changes"

          git push

      # ======================
      # Print Tags
      # ======================

      - name: Show Image Tags
        run: |
          echo "Frontend: ${{ secrets.DOCKER_USERNAME }}/frontend:${IMAGE_TAG}"
          echo "Backend: ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG}"
