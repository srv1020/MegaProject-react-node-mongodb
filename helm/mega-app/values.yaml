namespace: mega-app
apps:
  frontend:
    enabled: true
    type: deployment
    image: srvpndy/frontend
    tag: 9b0662f
    imagePullPolicy: IfNotPresent
    replicaCount: 2
    port: 80
    targetPort: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    livenessProbe:
      path: /
      initialDelaySeconds: 20
      periodSeconds: 10
    readinessProbe:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      cpuUtilization: 70
    monitoring:
      enabled: false
  backend:
    enabled: true
    type: deployment
    image: srvpndy/backend
    tag: 9b0662f
    imagePullPolicy: IfNotPresent
    replicaCount: 2
    port: 5001
    targetPort: 5001
    env:
      PORT: "5001"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB_NAME: srvpndy
      MONGO_AUTH_SOURCE: admin
      CORS_ORIGIN: http://mega.local:8080
    secrets:
      MONGO_USER: admin
      MONGO_PASSWORD: secure123
      JWT_SECRET: this-is-a-long-random-secret
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    livenessProbe:
      path: /api/healthz
      initialDelaySeconds: 60
      periodSeconds: 10
    readinessProbe:
      path: /api/healthz
      initialDelaySeconds: 30
      periodSeconds: 5
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      cpuUtilization: 70
    monitoring:
      enabled: true
mongo:
  enabled: true
  type: statefulset
  image: mongo
  tag: "7"
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  port: 27017
  username: admin
  password: secure123
  database: srvpndy
  mountPath: /data/db
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 10
ingress:
  host: mega.local
alerts:
  highErrorRate:
    threshold: 3
    for: 1m
  mongodbDown:
    for: 1m
  podRestarting:
    threshold: 3
    for: 1m
  podNotReady:
    for: 2m
  highCPU:
    threshold: 0.8
    for: 2m
  highMemory:
    threshold: 500
    for: 2m
