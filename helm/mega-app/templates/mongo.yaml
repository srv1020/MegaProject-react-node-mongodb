apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongo.storage }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo

    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}

          ports:
            - containerPort: {{ .Values.mongo.port }}

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.mongo.username | quote }}

            - name: MONGO_INITDB_ROOT_PASSWORD
              value: {{ .Values.mongo.password | quote }}

          volumeMounts:
            - name: mongo-data
              mountPath: {{ .Values.mongo.mountPath }}

          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: {{ .Values.mongo.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mongo.livenessProbe.periodSeconds }}

          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: {{ .Values.mongo.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mongo.readinessProbe.periodSeconds }}

      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongo

spec:
  selector:
    app: mongo

  ports:
    - port: {{ .Values.mongo.port }}
      targetPort: {{ .Values.mongo.port }}
