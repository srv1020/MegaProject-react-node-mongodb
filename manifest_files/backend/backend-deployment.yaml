# backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: thedeva

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: srvpndy/backend:bc6a778

          ports:
            - containerPort: 5001

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret