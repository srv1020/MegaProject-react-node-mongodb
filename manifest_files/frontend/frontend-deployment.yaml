# frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: thedeva

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: srvpndy/frontend:bc6a778

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: frontend-config